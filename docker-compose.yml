version: '2'
services:
  tt-cup-api:
    image: tt-cup-api:latest
    ports:
      - "6957:8080"
    networks:
      docker-mongo_network_mongo:
      network_mongo:
        ipv4_address: 172.20.0.4
    container_name: tt-cup-api
    env_file: .env
    restart: always
networks:
  docker-mongo_network_mongo:
    external: true
