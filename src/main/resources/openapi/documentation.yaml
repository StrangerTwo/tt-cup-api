openapi: "3.1.0"
info:
  title: "tt_cup_api API"
  description: "tt_cup_api API"
  version: "1.0.0"
servers:
  - url: "https://tt_cup_api"
paths:
  /:
    get:
      description: "getHello"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /capture:
    post:
      description: "capturePage"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureDto"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
  /crawl:
    get:
      description: "getPagesToCrawl"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedQueryResult_CrawlPage"
    post:
      description: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPagesToCrawlRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedQueryResult_CrawlPage"
  /match:
    post:
      description: "getMatches"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetMatchesRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedQueryResult_Match"
  /openapi.yaml:
    get:
      description: "getOpenapi"
      responses:
        "200":
          description: "OK"
          content:
            text/plain:
              schema:
                type: "string"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /player:
    post:
      description: "getPlayers"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPlayersRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedQueryResult_Player"
  /player/{playerUid}:
    get:
      description: "getPlayer"
      parameters:
        - name: "playerUid"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "object"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Player"
  /player/{playerUid}/favourite:
    patch:
      description: "setPlayerFavourite"
      parameters:
        - name: "playerUid"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Status"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                type: "object"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Status"
  /player/new:
    post:
      description: "newPlayer"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPlayer"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Status"
  /user:
    get:
      description: "getUser"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/User"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /{...}:
    get:
      description: ""
      parameters:
        - name: "..."
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
components:
  schemas:
    CaptureDto:
      type: "object"
      properties:
        url:
          type: "string"
        html:
          type: "string"
      required:
        - "url"
        - "html"
    CrawlPage:
      type: "object"
      properties:
        url:
          type: "string"
      required:
        - "url"
    PageInfo:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    PaginatedQueryResult:
      type: "object"
      properties:
        results:
          type: "array"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
        - "results"
        - "pageInfo"
    PaginatedQueryResult_CrawlPage:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/CrawlPage"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    PageInfoRequest:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
    GetPagesToCrawlRequest:
      type: "object"
      properties:
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    GetMatchesRequest:
      type: "object"
      properties:
        playerUid:
          type: "string"
          nullable: true
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    ObjectId:
      type: "object"
      properties:
        timestamp:
          type: "integer"
          format: "int32"
          nullable: true
    Match:
      type: "object"
      properties:
        time:
          type: "string"
          format: "date-time"
        playerUids:
          type: "array"
          items:
            type: "string"
        sets:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int32"
        points:
          type: "array"
          nullable: true
          items:
            type: "string"
        tournamentId:
          nullable: true
          $ref: "#/components/schemas/ObjectId"
        objectId:
          nullable: true
          $ref: "#/components/schemas/ObjectId"
      required:
        - "time"
        - "playerUids"
    PaginatedQueryResult_Match:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Match"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    GetPlayersRequest:
      type: "object"
      properties:
        search:
          type: "string"
          nullable: true
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    Player:
      type: "object"
      properties:
        uid:
          type: "string"
        name:
          type: "string"
          nullable: true
        elo:
          type: "integer"
          format: "int32"
          nullable: true
        recrawl:
          type: "boolean"
          nullable: true
        favourite:
          type: "boolean"
          nullable: true
      required:
        - "uid"
    PaginatedQueryResult_Player:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Player"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    Status:
      type: "object"
      properties:
        status:
          type: "boolean"
      required:
        - "status"
    NewPlayer:
      type: "object"
      properties:
        uid:
          type: "string"
      required:
        - "uid"
    User:
      type: "object"
      properties:
        uid:
          type: "string"
      required:
        - "uid"