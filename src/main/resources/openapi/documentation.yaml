components:
  schemas:
    BetSummary:
      type: "object"
      properties:
        betsWon:
          type: "integer"
          format: "int32"
        betsLost:
          type: "integer"
          format: "int32"
        betsUnresolved:
          type: "integer"
          format: "int32"
      required:
        - "betsWon"
        - "betsLost"
        - "betsUnresolved"
    PageInfoRequest:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
    GetBetsRequest:
      type: "object"
      properties:
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        tournamentId:
          type: "string"
          nullable: true
        matchId:
          type: "string"
          nullable: true
        playerUids:
          type: "array"
          nullable: true
          items:
            type: "string"
        type:
          type: "string"
          nullable: true
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
        win:
          type: "boolean"
          nullable: true
        resolved:
          type: "boolean"
          nullable: true
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    ObjectId:
      type: "object"
      properties:
        timestamp:
          type: "integer"
          format: "int32"
          nullable: true
    Bet:
      type: "object"
      properties:
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        tournamentId:
          $ref: "#/components/schemas/ObjectId"
        matchId:
          $ref: "#/components/schemas/ObjectId"
        playerUids:
          type: "array"
          items:
            type: "string"
        type:
          type: "string"
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
        win:
          type: "boolean"
          nullable: true
        objectId:
          $ref: "#/components/schemas/ObjectId"
      required:
        - "tournamentId"
        - "matchId"
        - "playerUids"
        - "type"
        - "objectId"
    Match:
      type: "object"
      properties:
        time:
          type: "string"
          format: "date-time"
        playerUids:
          type: "array"
          items:
            type: "string"
        sets:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int32"
        points:
          type: "array"
          nullable: true
          items:
            type: "string"
        tournamentId:
          $ref: "#/components/schemas/ObjectId"
        objectId:
          $ref: "#/components/schemas/ObjectId"
      required:
        - "time"
        - "playerUids"
        - "tournamentId"
        - "objectId"
    BetFull:
      type: "object"
      properties:
        bet:
          $ref: "#/components/schemas/Bet"
        match:
          $ref: "#/components/schemas/Match"
      required:
        - "bet"
        - "match"
    PageInfo:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    PaginatedQueryResult:
      type: "object"
      properties:
        results:
          type: "array"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
        - "results"
        - "pageInfo"
    PaginatedQueryResult_BetFull:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/BetFull"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    NewBet:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
      required:
        - "type"
    CaptureDto:
      type: "object"
      properties:
        url:
          type: "string"
        html:
          type: "string"
      required:
        - "url"
        - "html"
    CrawlPage:
      type: "object"
      properties:
        url:
          type: "string"
      required:
        - "url"
    PaginatedQueryResult_CrawlPage:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/CrawlPage"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    GetPagesToCrawlRequest:
      type: "object"
      properties:
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    Status:
      type: "object"
      properties:
        status:
          type: "boolean"
      required:
        - "status"
    GetMatchesRequest:
      type: "object"
      properties:
        playerUids:
          type: "array"
          nullable: true
          items:
            type: "string"
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    PaginatedQueryResult_Match:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Match"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    MatchFilter:
      type: "object"
      properties: { }
    GetTopMatchesRequest:
      type: "object"
      properties:
        filters:
          type: "array"
          items:
            $ref: "#/components/schemas/MatchFilter"
        done:
          type: "boolean"
          nullable: true
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "filters"
        - "pageInfo"
    Player:
      type: "object"
