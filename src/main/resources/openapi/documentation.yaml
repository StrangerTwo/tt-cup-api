    PaginatedQueryResult_TournamentMatches:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/TournamentMatches"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    GetPlayersRequest:
      type: "object"
      properties:
        search:
          type: "string"
          nullable: true
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        uids:
          type: "array"
          nullable: true
          items:
            type: "string"
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
