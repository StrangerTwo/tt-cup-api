components:
  schemas:
    PageInfoRequest:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
    GetBetsRequest:
      type: "object"
      properties:
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        tournamentId:
          type: "string"
          nullable: true
        matchId:
          type: "string"
          nullable: true
        playerUids:
          type: "array"
          nullable: true
          items:
            type: "string"
        type:
          type: "string"
          nullable: true
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    ObjectId:
      type: "object"
      properties:
        timestamp:
          type: "integer"
          format: "int32"
          nullable: true
    Bet:
      type: "object"
      properties:
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        tournamentId:
          $ref: "#/components/schemas/ObjectId"
        matchId:
          $ref: "#/components/schemas/ObjectId"
        playerUids:
          type: "array"
          items:
            type: "string"
        type:
          type: "string"
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
        objectId:
          $ref: "#/components/schemas/ObjectId"
      required:
        - "tournamentId"
        - "matchId"
        - "playerUids"
        - "type"
        - "objectId"
    PageInfo:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
    PaginatedQueryResult:
      type: "object"
      properties:
        results:
          type: "array"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
        - "results"
        - "pageInfo"
    PaginatedQueryResult_Bet:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Bet"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    NewBet:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "NO_BET"
            - "WIN_1"
            - "WIN_2"
      required:
        - "type"
    CaptureDto:
      type: "object"
      properties:
        url:
          type: "string"
        html:
          type: "string"
      required:
        - "url"
        - "html"
    CrawlPage:
      type: "object"
      properties:
        url:
          type: "string"
      required:
        - "url"
    PaginatedQueryResult_CrawlPage:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/CrawlPage"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    GetPagesToCrawlRequest:
      type: "object"
      properties:
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    GetMatchesRequest:
      type: "object"
      properties:
        playerUids:
          type: "array"
          nullable: true
          items:
            type: "string"
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    Match:
      type: "object"
      properties:
        time:
          type: "string"
          format: "date-time"
        playerUids:
          type: "array"
          items:
            type: "string"
        sets:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int32"
        points:
          type: "array"
          nullable: true
          items:
            type: "string"
        tournamentId:
          $ref: "#/components/schemas/ObjectId"
        objectId:
          $ref: "#/components/schemas/ObjectId"
      required:
        - "time"
        - "playerUids"
        - "tournamentId"
        - "objectId"
    PaginatedQueryResult_Match:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Match"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    GetPlacesRequest:
      type: "object"
      properties:
        search:
          type: "string"
          nullable: true
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    Place:
      type: "object"
      properties:
        uid:
          type: "string"
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        lastUpdate:
          type: "string"
          format: "date-time"
        disabled:
          type: "boolean"
          nullable: true
      required:
        - "uid"
        - "lastUpdate"
    PaginatedQueryResult_Place:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/Place"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    Status:
      type: "object"
      properties:
        status:
          type: "boolean"
      required:
        - "status"
    CreatePlaceByTournament:
      type: "object"
      properties:
        tournamentId:
          type: "string"
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
      required:
        - "tournamentId"
    OutdatedPlace:
      type: "object"
      properties:
        place:
          $ref: "#/components/schemas/Place"
        updateUrl:
