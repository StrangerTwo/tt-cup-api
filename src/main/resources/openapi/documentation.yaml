    Player:
      type: "object"
      properties:
        uid:
          type: "string"
        name:
          type: "string"
          nullable: true
        ranking:
          type: "integer"
          format: "int32"
          nullable: true
        elo:
          type: "integer"
          format: "int32"
          nullable: true
        favourite:
          type: "boolean"
          nullable: true
        location:
          type: "string"
          nullable: true
          enum:
            - "HAVLICKUV_BROD"
            - "PRAHA"
            - "HAVIROV"
        note:
          type: "string"
          nullable: true
        stisId:
          type: "string"
          nullable: true
        recrawl:
          type: "boolean"
          nullable: true
      required:
