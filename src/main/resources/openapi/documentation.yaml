components:
  schemas:
    TipTournament:
      type: "object"
      properties:
        logo:
          type: "string"
        name:
          type: "string"
        country:
          type: "string"
          nullable: true
      required:
        - "logo"
        - "name"
    TipTeam:
      type: "object"
      properties:
        name:
          type: "string"
        logo:
          type: "string"
        forecastScore:
          type: "number"
          format: "double"
      required:
        - "name"
        - "logo"
        - "forecastScore"
    ObjectId:
      type: "object"
      properties:
        timestamp:
          type: "integer"
          format: "int32"
          nullable: true
    Tip:
      type: "object"
      properties:
        id:
          type: "string"
        datetime:
          type: "string"
          format: "date-time"
        recommendation:
          type: "string"
        recommendationChance:
          type: "number"
          format: "double"
        url:
          type: "string"
        tournament:
          $ref: "#/components/schemas/TipTournament"
        homeTeam:
          $ref: "#/components/schemas/TipTeam"
        awayTeam:
          $ref: "#/components/schemas/TipTeam"
        objectId:
          nullable: true
          $ref: "#/components/schemas/ObjectId"
      required:
        - "id"
        - "datetime"
        - "recommendation"
        - "recommendationChance"
        - "url"
        - "tournament"
        - "homeTeam"
        - "awayTeam"
    UpdateFavouriteTip:
      type: "object"
      properties:
        favourite:
          type: "boolean"
        tickets:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int32"
      required:
        - "favourite"
    Status:
      type: "object"
      properties:
        status:
          type: "boolean"
      required:
        - "status"
    FavouriteTip:
      type: "object"
      properties:
        userId:
          type: "string"
        tipId:
          type: "string"
        tickets:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int32"
        timestamp:
          type: "string"
          format: "date-time"
      required:
        - "userId"
        - "tipId"
        - "timestamp"
    User:
      type: "object"
      properties:
        uid:
          type: "string"
      required:
        - "uid"