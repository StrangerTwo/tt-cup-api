openapi: "3.1.0"
info:
  title: "tt_cup_api API"
  description: "tt_cup_api API"
  version: "1.0.0"
servers:
  - url: "https://tt_cup_api"
paths:
  /:
    get:
      description: "getHello"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /capture:
    post:
      description: "capturePage"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureDto"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
  /crawl:
    get:
      description: "getPagesToCrawl"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPagesToCrawlRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Unit"
  /openapi.yaml:
    get:
      description: "getOpenapi"
      responses:
        "200":
          description: "OK"
          content:
            text/plain:
              schema:
                type: "string"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /players:
    get:
      description: "getPlayers"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Player"
  /players/new:
    post:
      description: "newPlayer"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPlayer"
        required: true
      responses:
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Status"
  /user:
    get:
      description: "getUser"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/User"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
  /{...}:
    get:
      description: ""
      parameters:
        - name: "..."
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: ""
components:
  schemas:
    CaptureDto:
      type: "object"
      properties:
        url:
          type: "string"
        html:
          type: "string"
      required:
        - "url"
        - "html"
    PageInfoRequest:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
          default: "20"
        sort:
          type: "array"
          nullable: true
          items:
            type: "string"
      required:
        - "page"
        - "size"
    GetPagesToCrawlRequest:
      type: "object"
      properties:
        pageInfo:
          $ref: "#/components/schemas/PageInfoRequest"
      required:
        - "pageInfo"
    Unit:
      type: "object"
      properties: { }
    Player:
      type: "object"
      properties:
        uid:
          type: "string"
        name:
          type: "string"
          nullable: true
        elo:
          type: "integer"
          format: "int32"
          nullable: true
      required:
        - "uid"
    NewPlayer:
      type: "object"
      properties:
        uid:
          type: "string"
      required:
        - "uid"
    Status:
      type: "object"
      properties:
        status:
          type: "boolean"
      required:
        - "status"
    User:
      type: "object"
      properties:
        uid:
          type: "string"
      required:
        - "uid"